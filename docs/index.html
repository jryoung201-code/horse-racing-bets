<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horse Racing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="sky"></div>
  <div class="app">
    <div class="track-wrap">
      <div class="track" id="track"></div>
      <div class="finish-flag">FINISH</div>
    </div>
    <p class="msg" id="msg"></p>
    <button class="btn gold start-race" id="startRaceBtn">Start race</button>
    <form class="add-bar" id="addForm">
      <input id="horseName" maxlength="18" placeholder="Horse name" />
      <input id="horseColor" type="color" value="#8b4513" title="Coat color" />
      <button class="btn gold" type="submit">Add horse</button>
    </form>
  </div>
  <script src="game.js"></script>
</body>
</html>
